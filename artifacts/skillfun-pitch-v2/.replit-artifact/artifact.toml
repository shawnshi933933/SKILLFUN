kind = "slides"
previewPath = "/skillfun-pitch-v2/"
title = "SKILLFUN MARKET DECK"
version = "1.0.0"
id = "artifacts/skillfun-pitch-v2"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/skillfun-pitch-v2/" ]
localPort = 20247

[services.development]
run = "pnpm --filter @workspace/skillfun-pitch-v2 run dev"

[services.production]
