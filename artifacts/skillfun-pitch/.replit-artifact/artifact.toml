kind = "slides"
previewPath = "/skillfun-pitch/"
title = "SkillFun Pitch Deck"
version = "1.0.0"
id = "artifacts/skillfun-pitch"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/skillfun-pitch/" ]
localPort = 18671

[services.development]
run = "pnpm --filter @workspace/skillfun-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillfun-pitch", "run", "build" ]
publicDir = "artifacts/skillfun-pitch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18671"
BASE_PATH = "/skillfun-pitch/"
