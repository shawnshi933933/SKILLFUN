kind = "web"
previewPath = "/"
title = "AI Skill Market"
version = "1.0.0"
id = "artifacts/skill-market"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22013

[services.development]
run = "pnpm --filter @workspace/skill-market run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skill-market", "run", "build" ]
publicDir = "artifacts/skill-market/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22013"
BASE_PATH = "/"
