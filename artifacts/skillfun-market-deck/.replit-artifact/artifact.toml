kind = "slides"
previewPath = "/skillfun-market-deck/"
title = "SkillFun Market Deck"
version = "1.0.0"
id = "artifacts/skillfun-market-deck"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/skillfun-market-deck/" ]
localPort = 21394

[services.development]
run = "pnpm --filter @workspace/skillfun-market-deck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillfun-market-deck", "run", "build" ]
publicDir = "artifacts/skillfun-market-deck/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21394"
BASE_PATH = "/skillfun-market-deck/"
